        WRF_W: [0.13636983931064606, 0.12900586426258087, 0.1247783973813057, 0.11823264509439468, 0.10909587144851685, 0.09750442951917648, 0.0831855982542038, 0.06818491965532303, 0.057275332510471344, 0.038183555006980896, 0.02454657107591629, 0.013636983931064606]
        WRF_Q_tot_05: [0.13636983931064606, 0.12900586426258087, 0.1247783973813057, 0.11823264509439468, 0.10909587144851685, 0.09750442951917648, 0.0831855982542038, 0.06818491965532303, 0.057275332510471344, 0.038183555006980896, 0.02454657107591629, 0.013636983931064606]
